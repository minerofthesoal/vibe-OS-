# vibeOS GRUB configuration for live ISO

insmod all_video

set default=0
set timeout=5
set gfxmode=auto
set gfxpayload=keep

# Theme
loadfont unicode
terminal_output gfxterm

menuentry "vibeOS Live (Hyprland Desktop)" --class arch --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G copytoram=n quiet splash
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "vibeOS Live (Safe Mode - no GPU accel)" --class arch --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset cow_spacesize=4G
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "vibeOS Live (Copy to RAM)" --class arch --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram quiet splash
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Boot existing OS" --class os {
    exit
}

menuentry "UEFI Firmware Settings" --class firmware {
    fwsetup
}

menuentry "System shutdown" --class shutdown {
    echo "Shutting down..."
    halt
}

menuentry "System restart" --class restart {
    echo "Restarting..."
    reboot
}
