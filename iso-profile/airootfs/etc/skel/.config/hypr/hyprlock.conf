# vibeOS hyprlock - Lock screen (macOS-inspired)

general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 3
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = /usr/share/vibeos/wallpapers/default.png
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# Time
label {
    monitor =
    text = $TIME
    text_align = center
    color = rgba(205, 214, 244, 1.0)
    font_size = 72
    font_family = Inter
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    text_align = center
    color = rgba(186, 194, 222, 0.9)
    font_size = 20
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}

# User avatar circle
shape {
    monitor =
    size = 120, 120
    color = rgba(137, 180, 250, 0.3)
    rounding = 60
    border_size = 3
    border_color = rgba(137, 180, 250, 0.6)
    position = 0, 0
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    text_align = center
    color = rgba(205, 214, 244, 1.0)
    font_size = 18
    font_family = Inter
    position = 0, -80
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(69, 71, 90, 0.6)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>
    hide_input = false
    rounding = 14
    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgba(249, 226, 175, 0.8)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -140
    halign = center
    valign = center
}
