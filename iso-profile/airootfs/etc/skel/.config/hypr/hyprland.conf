# ╔══════════════════════════════════════════════════════════════╗
# ║  vibeOS - Hyprland Configuration                           ║
# ║  Style: macOS Ventura × Win11 × KDE Plasma × Hyprland     ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Monitor Configuration ──────────────────────────────────────
monitor = , preferred, auto, 1

# ── Environment Variables ──────────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1

# ── Autostart ──────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Core services
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Shell components
exec-once = waybar
exec-once = swaync
exec-once = swww-daemon --format xrgb && sleep 0.5 && swww img /usr/share/vibeos/wallpapers/default.png --transition-type grow --transition-pos 0.5,0.9 --transition-duration 2
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet

# ── Input Configuration ───────────────────────────────────────
input {
    kb_layout = us
    kb_options = caps:escape
    follow_mouse = 1
    sensitivity = 0
    accel_profile = adaptive

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
        scroll_factor = 0.8
    }
}

# ── General Appearance ─────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475a88)
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
    extend_border_grab_area = 15
}

# ── Decoration (macOS-inspired blur & rounding) ───────────────
decoration {
    rounding = 12

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        popups = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a2ecc)
        color_inactive = rgba(1a1a2e88)
    }

    dim_inactive = false
    dim_strength = 0.1
}

# ── Animations (macOS Ventura fluid motion) ────────────────────
animations {
    enabled = true

    # Spring-like bezier curves
    bezier = fluent, 0.05, 0.9, 0.1, 1.05
    bezier = snappy, 0.4, 0.0, 0.2, 1.0
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = macOS, 0.25, 0.1, 0.25, 1.0

    animation = windows, 1, 5, fluent, slide
    animation = windowsIn, 1, 5, snappy, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, snappy, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, default, loop
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 5, macOS, slidevert
    animation = specialWorkspace, 1, 5, fluent, slidefadevert -50%
    animation = layers, 1, 4, fluent, slide
}

# ── Layout ─────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

# ── Gestures ───────────────────────────────────────────────────
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = true
}

# ── Misc ───────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
    focus_on_activate = true
    new_window_takes_over_fullscreen = 2
}

# ── Keybindings ────────────────────────────────────────────────
$mainMod = SUPER

# Application launchers
bind = $mainMod, Return, exec, kitty
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, firefox
bind = $mainMod, Space, exec, rofi -show drun -theme ~/.config/rofi/launcher.rasi
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/launcher.rasi | cliphist decode | wl-copy
bind = $mainMod, N, exec, swaync-client -t -sw

# Power menu
bind = $mainMod SHIFT, E, exec, wlogout -p layer-shell

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, T, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, G, togglegroup
bind = $mainMod, TAB, changegroupactive, f

# Focus movement
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Window movement
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize
bind = $mainMod CTRL, Left, resizeactive, -40 0
bind = $mainMod CTRL, Right, resizeactive, 40 0
bind = $mainMod CTRL, Up, resizeactive, 0 -40
bind = $mainMod CTRL, Down, resizeactive, 0 40

# Workspaces (Win11/KDE style)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9

bind = $mainMod CTRL, Right, workspace, e+1
bind = $mainMod CTRL, Left, workspace, e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Media & brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots
bind = , Print, exec, grim - | wl-copy && notify-send "Screenshot" "Copied to clipboard"
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Area copied to clipboard"

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Window Rules ───────────────────────────────────────────────
# Float rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrulev2 = float, class:^(vibeOS-installer)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(About)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(file-roller)$

# Size rules
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = size 900 650, class:^(vibeOS-installer)$
windowrulev2 = center, class:^(vibeOS-installer)$

# Opacity rules (glassmorphism)
windowrulev2 = opacity 0.92 0.88, class:^(kitty)$
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$
windowrulev2 = opacity 0.95 0.90, class:^(Code)$
windowrulev2 = opacity 0.95 0.90, class:^(discord)$

# Layer rules for Waybar/Rofi blur
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blurpopups, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window

# ── Optional Overrides ────────────────────────────────────────
# In live environment, hyprland-live.conf auto-launches the installer
# After installation, this file is removed so the source is a no-op
source = ~/.config/hypr/overrides.conf
