# vibeOS Live Environment - Hyprland config override
# This is sourced additionally when running in live mode

# Auto-launch installer
exec-once = sleep 2 && python3 /opt/vibeos/installer/main.py

# Desktop shortcut hint
exec-once = sleep 3 && notify-send "vibeOS Installer" "Welcome! The installer is starting.\nYou can also find it in the application menu." -i system-software-install
